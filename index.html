<body>
<canvas id="game" tabindex="0" aria-label="Игра «Ночной рейс» by Timur Abakarov. Держите палец, кнопку мыши или пробел, чтобы набирать высоту. Свайп вниз или стрелка вниз — пике, в пике самолёт таранит врагов. Пулемёт стреляет сам. Подбирайте усилители. P — пауза, M — звук."></canvas>
<script>
(() => {
'use strict';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
let W = 200, H = 400, PX = 54, TOP = 58;

const C = {
  bg: '#0d0e10', ink: '#0d0e10', white: '#f2f2ea', grey: '#8d8f96', dim: '#4a4c53',
  red: '#e22117', yellow: '#fff265', blue: '#3d9bff', cyan: '#4fe3ff', pink: '#ff5fcf', green: '#3ce03c', orange: '#ff9a3c',
  moon: '#f3f5de', moonSpot: '#c8cab0', win: '#f2c94c', winDim: '#8a6d2a', ghost: '#cdd1de'
};

// ---------- storage & helpers ----------
const store = {
  get(k) { try { return localStorage.getItem('nochnoy-reys:' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('nochnoy-reys:' + k, String(v)); } catch (e) {} }
};
let best = parseInt(store.get('best') || '0', 10) || 0;
let muted = store.get('muted') === '1';
let tutorialDone = store.get('tutorial') === '1';
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = f => f * f * (3 - 2 * f);
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
function mix(a, b, f) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(B[i] + (v - B[i]) * f).toString(16).padStart(2, '0')).join(''); }
const lerp3 = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
const rgb = a => 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')';
const lum = a => (0.3 * a[0] + 0.59 * a[1] + 0.11 * a[2]) / 255;
const overlap = (ax, ay, aw, ah, bx, by, bw, bh) => Math.abs(ax - bx) * 2 < aw + bw && Math.abs(ay - by) * 2 < ah + bh;

    const n = Math.max(12, Math.round(s.r * 1.2)), col = s.big ? (Math.floor(t * 20) % 2 ? WS_ORANGE : '#ffd23c') : C.yellow;
    ctx.fillStyle = col;
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; ctx.fillRect(Math.round(s.x + Math.cos(a) * s.r), Math.round(s.y + Math.sin(a) * s.r), 1, 1); }
  }
}
function drawPopups() {
  for (const q of popups) {
    if (!q.lines) {
      if (q.big) {
        const l1 = wrapLines(q.str, q.size, W - 12, 1);
        if (l1.length <= 2) { q.lines = l1; q.tr = 1; } else { q.lines = wrapLines(q.str, q.size, W - 12, 0); q.tr = 0; }
      } else { q.lines = [q.str]; q.tr = 0; }
      q.life = q.lines.length > 1 ? 1.6 : 1.0;
    }
    const life = q.life || 1;
    if (q.t > life - 0.3 && Math.floor(q.t * 16) % 2) continue;
    const lh = q.size >= 20 ? 24 : 12, n = q.lines.length;
    const y0 = clamp(q.y - (n - 1) * lh / 2, TOP + 4, H - 60 - (n - 1) * lh) - q.t * 12 - (q.t < 0.07 ? 3 : 0);
    q.lines.forEach((l, i) => {
      const w = textW(l, q.size, q.tr), x = clamp(q.x, Math.ceil(w / 2) + 3, W - Math.ceil(w / 2) - 3);
      if (q.big) stack(l, x, y0 + i * lh, q.size, q.color, 3, q.tr); else textPlate(l, x, y0 + i * lh, q.size, q.color);
    });
  }
}
function drawWsSplash() {
  if (!wsSplash || !WS_BIG || !WS_WORD) return;
  const k = wsSplash.t;
  if (k > 1.15 && Math.floor(k * 16) % 2) return;
  const drop = k < 0.14 ? Math.round((0.14 - k) * 60) : 0;
  const ly = Math.round(H * 0.28) - drop;
  ctx.drawImage(WS_BIG, Math.round(W / 2 - WS_BIG.width / 2), ly);
  ctx.drawImage(WS_WORD, Math.round(W / 2 - WS_WORD.width / 2), ly + WS_BIG.height + 4 + Math.round(drop * 0.5));
}
function drawHUD() {
  const y = 14;
  if (state !== 'title') textO('+ ' + kills, 6, y, 10, C.red, 'left');
  const bstr = best + ' м', bw = textW(bstr, 10), bx = Math.round(W / 2 - (9 + bw) / 2);
  ctx.drawImage(SPR.crown, bx - 1, y - 6);
  textO(bstr, bx + 9, y, 10, C.yellow, 'left');
  if (state === 'play' || state === 'pause') {
    ctx.drawImage(PAUSE_RING, W - 22, 2);
    ctx.fillStyle = C.white; ctx.fillRect(W - 15, 9, 1, 5); ctx.fillRect(W - 11, 9, 1, 5);
    if (oldBest > 0 && dist() > oldBest) {
      ctx.fillStyle = C.red; ctx.fillRect(W - 29, 22, 25, 10); ctx.fillRect(W - 30, 23, 1, 8); ctx.fillRect(W - 4, 23, 1, 8);
      text('NEW!', W - 16, 30, 10, C.white);
    }
  }
  if (state !== 'title') {
    for (let i = 0; i < lives; i++) ctx.drawImage(SPR.heart, 5 + i * 8, 19);
    const icons = [];
    if (gunLvl > 0) icons.push(['gun', -1]);
    if (bombT > 0) icons.push(['bomb', bombT]);
    if (shieldT > 0) icons.push(['shield', shieldT]);
    icons.forEach(([k, tt], i) => {
      const x = 4 + i * 16, yy = 28;
      if (tt >= 0 && tt < 2 && Math.floor(t * 8) % 2) return;
      ctx.drawImage(PICKUPS[k].spr, x, yy);
      if (k === 'gun') textO('x' + (gunLvl === 2 ? 3 : 2), x + 1, yy + 21, 10, C.green, 'left');
      if (tt >= 0) { ctx.fillStyle = C.ink; ctx.fillRect(x + 1, yy + 14, 12, 3); ctx.fillStyle = PICKUPS[k].col; ctx.fillRect(x + 2, yy + 15, Math.max(1, Math.round(10 * tt / PU_TIME)), 1); }
    });
    const dd = state === 'play' || state === 'pause' ? Math.floor(dist()) : finalDist;
    textO(dd + ' м', W / 2, 44, 20, C.white);
    if (state === 'play' && chain >= 2 && t - lastKillT < 1.4) textO('x' + chain, W / 2, 56, 10, C.white);
    if (boss && boss.state !== 'dying') {
      const bwid = Math.min(110, W - 70), bx0 = Math.round(W / 2 - bwid / 2), by = 68;
      textPlate(BOSS_INFO[boss.kind].name, W / 2, by - 3, 10, C.red);
      ctx.fillStyle = C.ink; ctx.fillRect(bx0 - 1, by, bwid + 2, 5);
      ctx.fillStyle = '#4a1210'; ctx.fillRect(bx0, by + 1, bwid, 3);
      ctx.fillStyle = C.red; ctx.fillRect(bx0, by + 1, Math.max(0, Math.round(bwid * boss.hp / boss.maxHp)), 3);
    }
  }
}
function button(label, y, fg, bg, on) {
  const w = Math.min(W - 24, 150), h = 22, x = Math.round(W / 2 - w / 2);
  ctx.fillStyle = C.ink; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = on ? mix(bg, '#ffffff', 0.7) : bg; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = mix(bg, '#ffffff', 0.6); ctx.fillRect(x, y, w, 1);
  ctx.fillStyle = mix(bg, '#000000', 0.6); ctx.fillRect(x, y + h - 1, w, 1);
  textO(label, W / 2, y + 17, 20, fg);
  return { x, y, w, h };
}
function frameBox(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(x + 1, y, w - 2, 1); ctx.fillRect(x + 1, y + h - 1, w - 2, 1); ctx.fillRect(x, y + 1, 1, h - 2); ctx.fillRect(x + w - 1, y + 1, 1, h - 2);
}
function drawOverlay() {
  if (state === 'title') {
    stack('НОЧНОЙ РЕЙС', W / 2, Math.round(H * 0.43), 20, C.white, 3, 1);
    drawCredit(1, 0);
    if (Math.floor(t * 1.6) % 2 === 0) textPlate('жми, чтобы взлететь', W / 2, Math.round(H * 0.62), 10, C.white);
    textPlate('в пике самолёт таранит врагов', W / 2, Math.round(H * 0.62) + 14, 10, '#c8cad2');
  } else if (state === 'pause') {
    ctx.fillStyle = 'rgba(13,14,16,0.86)'; ctx.fillRect(0, 0, W, H);
    const cy = Math.round(H * 0.38);
    stack('ПАУЗА', W / 2, cy, 30, C.white, 2);
    textO('жми, чтобы продолжить', W / 2, cy + 22, 10, C.white);
    soundBtn = button('звук: ' + (muted ? 'выкл' : 'вкл'), cy + 36, C.white, '#2a5fb0', false);
    textO('погода: ' + WX_NAME[wx.cur], W / 2, cy + 78, 10, '#c8cad2');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(13,14,16,0.88)'; ctx.fillRect(0, 0, W, H);
    let y = Math.round(H * 0.21);
    stack('СБИТ', W / 2, y, 30, C.red, 3, 1);
    y += 32;
    for (const l of wrapLines(deathMsg, 20, W - 14, 1)) { stack(l, W / 2, y, 20, C.yellow, 2, 1); y += 24; }
    y += 2;
    textO(finalDist + ' м', W / 2, y, 20, C.white); y += 22;
    if (finalDist >= best && finalDist > oldBest && oldBest > 0) { if (Math.floor(t * 4) % 2 === 0) textO('новый рекорд!', W / 2, y, 20, C.yellow); }
    else {
      const s = 'рекорд ' + best + ' м', w = textW(s, 20), bx = Math.round(W / 2 - (w + 11) / 2);
      ctx.drawImage(SPR.crown, bx - 1, y - 10); textO(s, bx + 11, y, 20, C.yellow, 'left');
    }
    y += 20;
    textO('сбито: ' + kills, W / 2, y, 20, C.white);
    y += 12;
    if (overT > 0.6) {
      retryBtn = button('ещё раз', y, C.white, '#b81d14', false);
      shareBtn = button('поделиться', y + 28, C.white, '#2a5fb0', pendingShare);
      if (toast && t - toast.t < 2.2) textO(toast.str, W / 2, y + 66, 10, C.green);
    }
    textO('by Timur Abakarov', W / 2, H - 10, 10, '#8d8f96');
  }
}
function render() {
  sky = skyNow();
  drawSky();
  ctx.save();
  if (shake > 0.5 && !reduceMotion) ctx.translate(Math.round(rand(-shake, shake)), Math.round(rand(-shake, shake)));
  const haze = rgb(sky.hor);
  drawLayer(0, haze, 0.12 + 0.45 * sky.day);
  drawLayer(1, haze, 0.06 + 0.3 * sky.day);
  drawHints();
  drawTrail();
  drawEnemies();
  drawLayer(2, haze, 0.03 + 0.08 * sky.day);
  drawPlayer();
  for (const q of particles) px(q.x, q.y, q.c, q.sz);
  drawShocks();
  drawPopups();
  ctx.restore();
  drawWeatherFront();
  if (flashT > 0 && !reduceMotion) { ctx.fillStyle = 'rgba(' + flashCol + ',' + (flashT * 2.4).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  drawWsSplash();
  if (state === 'play' && playT < 0.9) drawCredit(1 - playT / 0.9, -playT * 16);
  drawHUD();
  drawOverlay();
}

// ---------- sizing ----------
function resize() {
  const cw = document.body.clientWidth, ch = document.body.clientHeight, dpr = window.devicePixelRatio || 1;
  const scale = Math.max(1, Math.round(ch * dpr / 400));
  H = Math.max(260, Math.floor(ch * dpr / scale));
  W = Math.max(150, Math.min(Math.floor(cw * dpr / scale), Math.floor(H * 0.8)));
  cv.width = W; cv.height = H;
  cv.style.width = (W * scale / dpr) + 'px'; cv.style.height = (H * scale / dpr) + 'px';
  ctx.imageSmoothingEnabled = false;
  PX = Math.round(W * 0.27);
  layerCs = [mk(W, H), mk(W, H), mk(W, H)];
  layerCs.forEach(c => { c.getContext('2d').imageSmoothingEnabled = false; });
  buildBackdrop();
  if (state === 'play') { pause(); antennaFrom = Math.max(antennaFrom, camX + PX + 40); }
  if (player) player.y = clamp(player.y, TOP, H * 0.6);
  resetCity();
}

// ---------- input ----------
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
const inBox = (p, b) => b && p.x >= b.x - 4 && p.x <= b.x + b.w + 4 && p.y >= b.y - 4 && p.y <= b.y + b.h + 4;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const p = toLogical(e);
  if (state === 'play' && Math.hypot(p.x - (W - 13), p.y - 11) < 15) { pause(); return; }
  if (state === 'pause') { if (inBox(p, soundBtn)) setMuted(!muted); else resume(); return; }
  if (state === 'dead') return;
  if (state === 'over') { if (overT < 0.6) return; if (inBox(p, shareBtn)) { pendingShare = true; return; } start(); }
  else if (state === 'title') start();
  pointerHold = true;
  swipe = { y: e.clientY, t: performance.now() };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!swipe || state !== 'play') return;
  const now = performance.now(), dy = e.clientY - swipe.y;
  if (dy > 26 && now - swipe.t < 380) { dive(); swipe = { y: e.clientY, t: now }; }
  else if (now - swipe.t > 380 || dy < 0) swipe = { y: e.clientY, t: now };
});
const release = () => { pointerHold = false; swipe = null; pendingShare = false; };
cv.addEventListener('pointerup', e => {
  initAudio();
  if (pendingShare) { pendingShare = false; if (state === 'over' && inBox(toLogical(e), shareBtn)) shareResult(); }
  release();
});
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
async function shareResult() {
  const url = location.href.split('#')[0];
  const msg = 'Я пролетел ' + finalDist + ' м в «Ночном рейсе». Сможешь дальше?';
  if (navigator.share) { try { await navigator.share({ title: 'Ночной рейс', text: msg, url }); return; } catch (err) { if (err && err.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(msg + ' ' + url); toast = { str: 'ссылка скопирована', t }; return; } catch (err) {}
  toast = { str: 'скопируй адрес страницы', t };
}
const UP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
addEventListener('keydown', e => {
  const k = e.code;
  if (UP_KEYS.includes(k)) {
    e.preventDefault(); if (e.repeat) return; initAudio();
    if (state === 'title' || (state === 'over' && overT > 0.6)) start();
    else if (state === 'pause') { resume(); return; }
    keyHold = true;
  } else if (k === 'ArrowDown' || k === 'KeyS') { e.preventDefault(); dive(); }
  else if (k === 'KeyP' || k === 'Escape') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  else if (k === 'KeyM') { initAudio(); setMuted(!muted); }
});
addEventListener('keyup', e => { if (UP_KEYS.includes(e.code)) keyHold = false; });
addEventListener('blur', () => { keyHold = false; pointerHold = false; pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('resize', resize);

// ---------- boot ----------
resetRun();
resetSegs(-400);
resize();
sky = skyNow();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) {
  Promise.race([
    Promise.all([document.fonts.load('10px "Tiny5"', 'A1'), document.fonts.load('10px "Tiny5"', 'Жж')]),
    new Promise(r => setTimeout(r, 2000))
  ]).then(() => { tcache.clear(); buildBackdrop(); });
}
})();
</script>

<body>
<canvas id="game" tabindex="0" aria-label="Игра «Ночной рейс». Держите палец, кнопку мыши или пробел, чтобы набирать высоту. Свайп вниз или стрелка вниз — пике, в пике самолёт таранит врагов. Пулемёт стреляет сам. P — пауза, M — звук."></canvas>
<script>
(() => {
'use strict';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
let W = 200, H = 400, PX = 54, TOP = 58;

// ---------- palette (sampled from the reference) ----------
const C = {
  bg: '#0d0e10', white: '#f2f2ea', grey: '#8d8f96', dim: '#4a4c53',
  red: '#e22117', yellow: '#fff265', blue: '#3d9bff', cyan: '#4fe3ff', pink: '#ff5fcf', green: '#3ce03c',
  moon: '#f3f5de', moonSpot: '#c8cab0', halo: ['#1d1e23', '#17181c', '#121316'],
  win: '#f2c94c', winDim: '#8a6d2a', ghost: '#cdd1de'
};

// ---------- storage ----------
const store = {
  get(k) { try { return localStorage.getItem('nochnoy-reys:' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('nochnoy-reys:' + k, String(v)); } catch (e) {} }
};
let best = parseInt(store.get('best') || '0', 10) || 0;
let muted = store.get('muted') === '1';
let tutorialDone = store.get('tutorial') === '1';
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
function mix(a, b, f) {
  const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(B[i] + (v - B[i]) * f).toString(16).padStart(2, '0')).join('');
}
function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return Math.abs(ax - bx) * 2 < aw + bw && Math.abs(ay - by) * 2 < ah + bh;
}

// ---------- sprites ----------
const PAL = { X: C.white, g: C.grey, r: C.red, Y: C.yellow, G: C.green, W: C.white, h: C.ghost };
function sprite(rows, map) {
  map = map || PAL;
  const h = rows.length, w = rows[0].length, c = mk(w, h), g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const col = map[rows[y][x]];
    if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
  }
  return c;
}

const FONT = '"Tiny5", monospace';
const tcache = new Map();
const mctx = mk(1, 1).getContext('2d');
function tsprite(str, size, color) {
  const key = size + '|' + color + '|' + str;
  let s = tcache.get(key);
  if (s) return s;
  mctx.font = size + 'px ' + FONT;
  const w = Math.max(1, Math.ceil(mctx.measureText(str).width) + 2);
  const h = Math.ceil(size * 1.6) + 2;
  const base = Math.round(size * 1.15) + 1;
  const c = mk(w, h), g = c.getContext('2d');
  g.font = size + 'px ' + FONT; g.fillStyle = color; g.textBaseline = 'alphabetic';
  g.fillText(str, 1, base);

  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] >= 110) { d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = 255; } else d[i + 3] = 0;
  }
  g.putImageData(id, 0, 0);

  if (tcache.size > 600) tcache.delete(tcache.keys().next().value);

}
function text(str, x, y, size, color, align) {
  const s = tsprite(str, size, color);
  const dx = align === 'left' ? x : align === 'right' ? x - s.w : x - Math.floor(s.w / 2);
  ctx.drawImage(s.c, Math.round(dx) - 1, Math.round(y) - s.base);
}
const textW = (str, size) => tsprite(str, size, C.white).w;
const SHADES = [0.55, 0.33, 0.18, 0.1];
function stack(str, x, y, size, color, n) {
  n = n || 3;
  const step = size >= 20 ? 2 : 1;
  for (let i = n; i >= 1; i--) text(str, x, y + i * step, size, mix(color, C.bg, SHADES[i - 1]), 'center');
  text(str, x, y, size, color, 'center');
}

let actx = null, master = null, noiseBuf = null;
function initAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!actx || muted) return;

  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';

  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, freq) {

  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t0);
  f.frequency.exponentialRampToValueAtTime(80, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t0); s.stop(t0 + dur + 0.02);
}

// ---------- city ----------
const LAYERS = [
  { f: 0.2, kind: 0, wr: [12, 30], gap: [0, 3], roof: [104, 156] },
  { f: 0.5, kind: 1, wr: [14, 30], gap: [0, 4], roof: [80, 130] },
  { f: 1.0, kind: 2, wr: [18, 36], gap: [1, 4], roof: [46, 106] }
];
let layers = [], antennaFrom = Infinity;

function makeBack(kind, w, roof) {
  const extra = 8, top = roof - extra, h = H - top, ry = extra;
  const c = mk(w, h), g = c.getContext('2d');
  const body = kind === 0 ? '#181a20' : '#23272f';
  const edge = kind === 0 ? '#1f2229' : '#2e333d';
  g.fillStyle = body; g.fillRect(0, ry, w, h - ry);
  if (Math.random() < 0.4) {
    const sw = randi(Math.floor(w * 0.3), Math.floor(w * 0.7)), sx = randi(0, w - sw), sh = randi(2, 7);
    g.fillStyle = body; g.fillRect(sx, ry - sh, sw, sh);
    g.fillStyle = edge; g.fillRect(sx, ry - sh, sw, 1);
  }
  g.fillStyle = edge; g.fillRect(0, ry, w, 1); g.fillRect(0, ry, 1, h - ry);
  if (kind === 0) {
    for (let y = ry + 4; y < h; y += 4) for (let x = 2; x < w - 1; x += 3)
      if (Math.random() < 0.05) { g.fillStyle = '#3a3426'; g.fillRect(x, y, 1, 1); }
  } else {
    for (let y = ry + 3; y < h; y += 4) for (let x = 2; x < w - 2; x += 3) {
      const r = Math.random();
      g.fillStyle = r < 0.05 ? '#a2843a' : r < 0.08 ? '#4e4228' : '#1a1d23';
      g.fillRect(x, y, 1, 2);
    }
  }

}

function makeFront(w, roof, ant) {
  const extra = ant ? ant.h + 6 : 14;
  const top = roof - extra, h = H - top, ry = extra;
  const c = mk(w, h), g = c.getContext('2d');
  const light = Math.random() < 0.35;
  const body = light ? '#5d647c' : '#3a404c';
  const edge = light ? '#7f87a2' : '#4e5564';
  const shade = light ? '#474d61' : '#2c313b';
  const roofC = light ? '#8a92ad' : '#5a6274';
  g.fillStyle = body; g.fillRect(0, ry, w, h - ry);
  const style = Math.random();
  if (!ant && style < 0.25 && w >= 20) {
    const ph = Math.min(extra - 1, Math.floor(w * 0.35));
    for (let r = 0; r < ph; r++) {
      const inset = Math.round((ph - r) * (w / 2) / ph);
      g.fillStyle = r === 0 ? edge : roofC;
      g.fillRect(inset, ry - ph + r, Math.max(1, w - 2 * inset), 1);
    }
  } else if (!ant && style < 0.45) {
    const bw = randi(4, 7), bx = randi(2, w - bw - 2), bh = randi(3, 5);
    g.fillStyle = edge; g.fillRect(bx, ry - bh - 2, bw, bh);
    g.fillRect(bx, ry - 2, 1, 2); g.fillRect(bx + bw - 1, ry - 2, 1, 2);
  } else if (style < 0.65) {
    const sw = randi(Math.floor(w * 0.3), Math.floor(w * 0.6)), sx = randi(1, w - sw - 1), sh = randi(3, Math.min(8, extra - 1));
    g.fillStyle = body; g.fillRect(sx, ry - sh, sw, sh);
    g.fillStyle = edge; g.fillRect(sx, ry - sh, sw, 1); g.fillRect(sx, ry - sh, 1, sh);
  }
  g.fillStyle = edge; g.fillRect(0, ry, w, 1); g.fillRect(0, ry, 1, h - ry);
  g.fillStyle = shade; g.fillRect(w - 1, ry + 1, 1, h - ry);
  const off = light ? '#2a2e3a' : '#1b1e24';
  for (let y = ry + 4; y < h - 2; y += 5) for (let x = 3; x < w - 3; x += 4) {
    const r = Math.random();
    g.fillStyle = r < 0.1 ? C.win : r < 0.14 ? C.winDim : off;
    g.fillRect(x, y, 2, 2);
  }
  if (ant) {
    const ax = ant.x, ty = ry - ant.h;
    g.fillStyle = C.white;
    g.fillRect(ax, ty, 1, ant.h);
    [1, 3, 5, 3, 1].forEach((dw, i) => g.fillRect(ax - (dw >> 1), ty - 4 + i, dw, 1));
  }
  const data = g.getImageData(0, 0, w, h).data, prof = new Int16Array(w).fill(H * 2);
  for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) if (data[(y * w + x) * 4 + 3] > 0) { prof[x] = top + y; break; }
  return { c, top, prof };
}

function resetCity() {
  layers = LAYERS.map(L => Object.assign({}, L, { items: [], nextX: Math.floor(camX * L.f) - 30, lastRoof: null }));
  ensureCity();
}
function ensureCity() {
  const d = dist();
  for (const L of layers) {
    const off = Math.round(camX * L.f);
    while (L.nextX < off + W + 40) {
      const w = randi(L.wr[0], L.wr[1]);
      let roof = H - randi(L.roof[0], L.roof[1]);
      if (L.kind === 2 && L.lastRoof !== null) roof = clamp(roof, L.lastRoof - 34, L.lastRoof + 34);
      L.lastRoof = roof;
      let item;
      if (L.kind === 2) {
        let ant = null;
        if (L.nextX > antennaFrom && Math.random() < Math.min(0.36, 0.18 + d * 0.0003) && w >= 18) {
          ant = { x: randi(4, w - 5), h: randi(18, 30 + Math.min(18, Math.floor(d * 0.03))) };
        }
        item = makeFront(w, roof, ant);
      } else item = makeBack(L.kind, w, roof);
      item.x = L.nextX; item.w = w;
      L.items.push(item);
      L.nextX += w + randi(L.gap[0], L.gap[1]);
    }
    while (L.items.length && L.items[0].x + L.items[0].w < off - 10) L.items.shift();
  }
}
function drawLayer(L) {
  const off = Math.round(camX * L.f);
  for (const it of L.items) {
    const sx = it.x - off;
    if (sx > W || sx + it.w < 0) continue;
    ctx.drawImage(it.c, sx, it.top);
  }
}
function cityHit(cx, cy, hw, hh) {
  const L = layers[2], off = Math.round(camX);
  for (const it of L.items) {
    const sx = it.x - off;
    if (sx > cx + hw || sx + it.w < cx - hw) continue;
    const c0 = Math.max(0, Math.floor(cx - hw - sx)), c1 = Math.min(it.w - 1, Math.floor(cx + hw - sx));
    for (let c = c0; c <= c1; c++) if (cy + hh >= it.prof[c]) return true;
  }
  return false;
}

// ---------- game state ----------
let state = 'title';           // title | play | pause | dead | over
let t = 0, playT = 0, camX = 0, startX = 0, speed = 40;
let player, bullets, ebullets, enemies, particles, popups, trail, pickups;
let kills = 0, chain = 0, lastKillT = -9, spawnT = 0, eplaneT = 0, pickupT = 0, doubleGunT = 0;
let shake = 0, deadT = 0, overT = 0, lastTrailX = 0;
let oldBest = 0, finalDist = 0, recordShown = false;
let pointerHold = false, keyHold = false, usedHold = false, usedDive = false;
let swipe = null, soundBtn = null, retryBtn = null, shareBtn = null, pendingShare = false, toast = null;
const isHolding = () => pointerHold || keyHold;
const dist = () => state === 'title' ? 0 : Math.max(0, (camX - startX) / 10);

function resetRun() {
  player = { y: Math.round(H * 0.52), vy: 0, ang: 0, diveT: 0, diveCD: 0, fireT: 0.4, flashT: 0 };
  bullets = []; ebullets = []; enemies = []; particles = []; popups = []; trail = []; pickups = [];
  kills = 0; chain = 0; lastKillT = -9; doubleGunT = 0; playT = 0; recordShown = false;
}
function start() {
  initAudio();

  state = 'play';
  startX = camX; antennaFrom = camX + W + 60;
  resetCity();
  oldBest = best;
  spawnT = 1.6; eplaneT = 6; pickupT = rand(14, 20);
  player.vy = -60; lastTrailX = camX;
  usedHold = false; usedDive = false;
}
function pause() { if (state === 'play') { state = 'pause'; pointerHold = false; keyHold = false; } }

function die() {
  if (state !== 'play') return;
  state = 'dead'; deadT = 0;
  shake = 6;
  burst(PX, player.y, 34, [C.white, C.white, C.red, C.yellow], 120);
  burst(PX, player.y, 10, [C.red], 60, 2);
  sfx.boom();
  finalDist = Math.floor(dist());
  if (finalDist > best) { best = finalDist; store.set('best', best); }
  if (usedHold && usedDive && !tutorialDone) { tutorialDone = true; store.set('tutorial', '1'); }
}

function dive() {
  if (state !== 'play' || player.diveCD > 0) return;
  player.diveT = 0.3; player.diveCD = 1.1; usedDive = true;
  sfx.dive();
}

function fire() {
  const a = player.ang, nx = PX + Math.cos(a) * 9, ny = player.y + Math.sin(a) * 9;
  const angs = doubleGunT > 0 ? [a - 0.07, a + 0.07] : [a];
  for (const an of angs) bullets.push({ x: nx, y: ny, vx: Math.cos(an) * 300, vy: Math.sin(an) * 300 });
  player.flashT = 0.05;
  sfx.shoot();
}

function burst(x, y, n, colors, spd, sz) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(0.25, 1) * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: rand(0.35, 0.9), c: colors[i % colors.length], sz: sz || (Math.random() < 0.15 ? 2 : 1) });
  }
}

function popup(str, x, y, color, size, big) {
  if (big) popups = popups.filter(p => !p.big);
  popups.push({ str, x, y, color, size, big, t: 0 });
}

const COMBO = {
  2: ['ДВОЙНОЙ!', C.white], 3: ['ТРОЙНОЙ!', C.yellow], 4: ['РАЗНОС', C.pink], 5: ['ДИКИЙ', C.cyan], 6: ['ЛЕГЕНДА', C.green]
};
function kill(e, byDive) {
  e.dead = true; kills++;
  if (e.type === 'bat') { burst(e.x, e.y, 10, [C.white], 70); burst(e.x, e.y, 3, [C.red], 50); }
  else if (e.type === 'ghost') burst(e.x, e.y, 14, [C.ghost, C.white, C.grey], 60);
  else { burst(e.x, e.y, 22, [C.white, C.yellow, C.red], 100); shake = Math.max(shake, 2); }
  chain = (t - lastKillT < 1.4) ? chain + 1 : 1;
  lastKillT = t;
  let word = null, col = C.white;
  if (chain >= 2) { [word, col] = COMBO[Math.min(chain, 6)]; }
  if (byDive && chain < 3) { word = 'ЖЁСТКО'; col = C.blue; shake = Math.max(shake, 3); }
  if (word) popup(word, e.x, e.y - 8, col, 20, true);
  sfx.kill();
  if (chain >= 2) sfx.combo(chain);
}

// ---------- spawning ----------
function spawn(dt, d) {
  const yMin = TOP + 14, yMax = H - 124;
  const interval = Math.max(0.5, 1.45 - d * 0.0016);
  spawnT -= dt;
  if (spawnT <= 0) {
    const r = Math.random();
    if (d > 90 && r < 0.24) {
      const n = d > 320 ? randi(4, 5) : 3, y = rand(yMin + 6, yMax - 6);
      for (let i = 0; i < n; i++) enemies.push(mkBat(W + 10 + i * 16, y, 2.5, i * 0.7));
      spawnT = interval * 1.7;
    } else if (d > 55 && r < 0.46) {
      enemies.push({ type: 'ghost', x: W + 10, y: rand(yMin, yMax), vx: rand(6, 14), hp: 2, t: 0, flash: 0, minD: 99, chase: 16 + Math.min(14, d * 0.02) });
      spawnT = interval * rand(0.8, 1.2);
    } else {
      enemies.push(mkBat(W + 10, rand(yMin, yMax), rand(5, 11), rand(0, 6)));
      spawnT = interval * rand(0.7, 1.25);
    }
  }
  if (d > 140) {
    eplaneT -= dt;
    if (eplaneT <= 0) {
      enemies.push({ type: 'eplane', x: W + 14, baseY: rand(yMin, yMax - 14), y: 0, vx: 26, hp: 3, t: 0, flash: 0, minD: 99, fireT: 1.0, warn: false });
      eplaneT = Math.max(4, 9 - d * 0.006) * rand(0.8, 1.2);
    }
  }
  if (d > 25) {
    pickupT -= dt;
    if (pickupT <= 0) {
      const y = rand(yMin, yMax);
      pickups.push({ x: W + 8, baseY: y, y, t: 0 });
      pickupT = rand(22, 32);
    }
  }
}
function mkBat(x, y, amp, ph) {
  return { type: 'bat', x, baseY: y, y, vx: rand(14, 34), amp, ph, freq: rand(2.5, 4), hp: 1, t: 0, flash: 0, minD: 99 };
}
const BOX = { bat: [9, 5], ghost: [8, 9], eplane: [15, 6] };

// ---------- update ----------
const G = 330, THRUST = 720;
function update(dt) {
  t += dt;
  if (state === 'pause') return;
  shake = Math.max(0, shake - dt * 18);

  if (state === 'title') {
    camX += 36 * dt;
    player.y = Math.round(H * 0.52) + Math.sin(t * 2.2) * 3;
    player.ang = Math.cos(t * 2.2) * 0.08;
    ensureCity(); stepTrail();
    return;
  }

  if (state === 'play') {
    playT += dt;
    const d = dist(), p = player;
    speed = 64 + Math.min(46, d * 0.055);
    camX += speed * dt;
    ensureCity();
    const hold = isHolding();
    if (hold) usedHold = true;
    if (p.diveT > 0) {
      p.diveT -= dt; p.vy = 250;
      if (p.diveT <= 0) p.vy = 30;
    } else {
      p.vy = clamp(p.vy + ((hold ? -THRUST : 0) + G) * dt, -165, 205);
    }
    p.y += p.vy * dt;
    if (p.y < TOP) { p.y = TOP; if (p.vy < 0) p.vy = 0; }
    p.diveCD = Math.max(0, p.diveCD - dt);
    const ta = clamp(Math.atan2(p.vy, speed * 1.6), -0.6, 0.75);
    p.ang += (ta - p.ang) * Math.min(1, dt * 12);
    p.flashT -= dt;
    p.fireT -= dt;
    if (p.fireT <= 0) { fire(); p.fireT = doubleGunT > 0 ? 0.13 : 0.17; }
    doubleGunT = Math.max(0, doubleGunT - dt);
    spawn(dt, d);
    if (!recordShown && oldBest > 0 && d > oldBest) {
      recordShown = true; popup('РЕКОРД!', W / 2, Math.round(H * 0.34), C.yellow, 20, false); sfx.record();
    }
    stepTrail();
  }

  if (state === 'dead' || state === 'over') {
    speed *= Math.pow(0.12, dt);
    camX += speed * dt;
    ensureCity();
    if (state === 'dead') { deadT += dt; if (deadT > 1.0) { state = 'over'; overT = 0; } }
    else overT += dt;
  }

  // bullets
  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  bullets = bullets.filter(b => !b.dead && b.x < W + 8 && b.y > -8 && b.y < H + 8);

  // enemies
  for (const e of enemies) {
    e.t += dt; e.flash -= dt;
    e.x -= (speed + e.vx) * dt;
    if (e.type === 'bat') e.y = e.baseY + Math.sin(e.t * e.freq + e.ph) * e.amp;
    else if (e.type === 'ghost') {
      if (state === 'play') e.y += clamp(player.y - e.y, -1, 1) * e.chase * dt;
      e.y = clamp(e.y, TOP + 4, H - 118);
    } else if (e.type === 'eplane') {
      e.y = e.baseY + Math.sin(e.t * 1.5) * 6;
      e.fireT -= dt;
      e.warn = e.fireT > 0 && e.fireT < 0.35;
      if (e.fireT <= 0) {
        if (state === 'play' && e.x < W - 6 && e.x > PX + 40) {
          const dx = PX - e.x, dy = player.y - e.y, l = Math.hypot(dx, dy) || 1;
          ebullets.push({ x: e.x - 9, y: e.y + 1, vx: dx / l * 110, vy: dy / l * 110 });
          sfx.eshoot();
        }
        e.fireT = rand(1.5, 2.2);
      }
    }
    if (state === 'play') {
      const dd = Math.hypot(e.x - PX, e.y - player.y);
      if (dd < e.minD) e.minD = dd;
      if (!e.passed && e.x < PX - 10) {
        e.passed = true;
        if (e.minD < 11) { popup('ВПРИТЫК', PX + 6, player.y - 12, C.grey, 10, false); sfx.near(); }
      }
    }
  }

  // bullet hits
  for (const b of bullets) {
    for (const e of enemies) {
      if (e.dead) continue;
      const bx = BOX[e.type];
      if (overlap(b.x, b.y, 4, 3, e.x, e.y, bx[0], bx[1])) {
        b.dead = true; e.hp--; e.flash = 0.08;
        burst(b.x, b.y, 3, [C.yellow, C.white], 40);
        if (e.hp <= 0) kill(e, false); else sfx.hit();
        break;
      }
    }
  }

  // enemy bullets
  for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  ebullets = ebullets.filter(b => b.x > -6 && b.x < W + 6 && b.y > -6 && b.y < H + 6 && !b.dead);

  // pickups
  for (const k of pickups) { k.t += dt; k.x -= (speed + 10) * dt; k.y = k.baseY + Math.sin(k.t * 3) * 3; }

  if (state === 'play') {
    const p = player, diving = p.diveT > 0;
    for (const e of enemies) {
      if (e.dead) continue;
      const bx = BOX[e.type];
      if (overlap(PX, p.y, diving ? 15 : 12, diving ? 10 : 6, e.x, e.y, bx[0], bx[1])) {
        if (diving) { e.hp = 0; kill(e, true); } else { die(); break; }
      }
    }
    for (const b of ebullets) if (state === 'play' && overlap(PX, p.y, 12, 6, b.x, b.y, 2, 2)) { b.dead = true; die(); }
    for (const k of pickups) {
      if (!k.dead && overlap(PX, p.y, 16, 12, k.x, k.y, 9, 9)) {
        k.dead = true; doubleGunT = 8;
        popup('ДВА СТВОЛА', PX + 46, p.y - 12, C.green, 20, true);
        burst(k.x, k.y, 10, [C.green, C.white], 50);
        sfx.pickup();
      }
    }
    if (state === 'play' && (cityHit(PX, p.y, 6, 3) || p.y > H - 8)) die();
  }

  enemies = enemies.filter(e => !e.dead && e.x > -24);
  pickups = pickups.filter(k => !k.dead && k.x > -10);

  for (const q of particles) { q.vy += 220 * dt; q.x += (q.vx - speed * 0.4) * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  for (const q of popups) q.t += dt;
  popups = popups.filter(q => q.t < 1.0);
}

function stepTrail() {
  if (camX - lastTrailX >= 5) {
    lastTrailX = camX;
    const a = player.ang;
    trail.push({ wx: camX + PX - Math.cos(a) * 8, y: player.y - Math.sin(a) * 8, dive: player.diveT > 0 });
    if (trail.length > 40) trail.shift();
  }
}

// ---------- render ----------
function drawRot(img, x, y, ang) {
  const w = img.width, h = img.height;
  ang = Math.round(ang / 0.17) * 0.17;
  if (Math.abs(ang) < 0.04) { ctx.drawImage(img, Math.round(x - Math.floor(w / 2)), Math.round(y - Math.floor(h / 2))); return; }
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.rotate(ang);
  ctx.drawImage(img, -Math.floor(w / 2), -Math.floor(h / 2));
  ctx.restore();
}
function px(x, y, c, s) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), s || 1, s || 1); }

function drawHints() {
  const show = state === 'title' || (state === 'play' && !tutorialDone && playT < 16);
  if (!show) return;
  const y = moonY + 34, lx = Math.round(W / 2 - 40), rx = Math.round(W / 2 + 40);
  const live = state === 'play';
  const lc = live && isHolding() ? C.green : live && usedHold ? C.dim : C.white;
  ctx.drawImage(ring(lc), lx - 12, y - 12);
  text('жми', lx, y + 3, 10, lc);
  text('держи', lx, y + 24, 10, lc === C.green ? C.white : lc);
  const rc = live && player.diveT > 0 ? C.green : live && usedDive ? C.dim : C.white;
  const off = Math.floor((t * 9) % 7);
  ctx.drawImage(tinted(SPR.hand, rc), rx - 3, y - 9 + off);
  text('свайп вниз', rx, y + 24, 10, rc === C.green ? C.white : rc);
}

function drawTrail() {
  const n = trail.length;
  for (let i = 0; i < n; i++) {
    const d = trail[i], age = n - 1 - i;
    const c = d.dive ? C.white : age < 8 ? '#74767d' : age < 18 ? '#46484e' : '#2c2e33';
    px(d.wx - camX, d.y, c);
  }
}

function drawPlayer() {
  if (state !== 'play' && state !== 'title' && state !== 'pause') return;
  const p = player, f = Math.floor(t * 22) % 2;
  drawRot(SPR.plane[f], PX, p.y, p.ang);
  if (p.flashT > 0) {
    const nx = PX + Math.cos(p.ang) * 10, ny = p.y + Math.sin(p.ang) * 10;
    px(nx, ny, C.yellow); if (doubleGunT > 0) px(nx, ny - 2, C.yellow);
  }
  if (p.diveT > 0) for (let i = 0; i < 3; i++) px(PX - 4 + i * 4, p.y - 7 - ((t * 60 + i * 3) % 6), C.white);
  if (doubleGunT > 0 && (doubleGunT > 2 || Math.floor(t * 10) % 2)) px(PX - 9, p.y - 4, C.green);
}

function drawEnemies() {
  for (const e of enemies) {
    const hit = e.flash > 0;
    if (e.type === 'bat') {
      const f = Math.floor(e.t * 9 + e.ph) % 2;
      drawRot((hit ? SPR.hit.bat : SPR.bat)[f], e.x, e.y, 0);
    } else if (e.type === 'ghost') {
      const f = Math.floor(e.t * 4) % 2;
      drawRot((hit ? SPR.hit.ghost : SPR.ghost)[f], e.x + (Math.floor(e.t * 3) % 2), e.y, 0);
    } else {
      const f = Math.floor(e.t * 22) % 2;
      drawRot((hit ? SPR.hit.eplane : SPR.eplane)[f], e.x, e.y, 0);
      if (e.warn && Math.floor(t * 20) % 2) { px(e.x - 10, e.y, C.red, 2); }
    }
  }
  for (const k of pickups) {
    for (let i = 1; i <= 4; i++) px(k.x + 4 + i * 5, k.baseY + Math.sin((k.t - i * 0.08) * 3) * 3, i < 3 ? C.green : '#1d6b1d');
    if (Math.floor(k.t * 6) % 3) drawRot(SPR.pickup, k.x, k.y, 0); else drawRot(tinted(SPR.pickup, C.white), k.x, k.y, 0);
  }
  for (const b of ebullets) { px(b.x - b.vx * 0.02, b.y - b.vy * 0.02, '#7a1410'); px(b.x - 1, b.y - 1, C.red, 2); }
  for (const b of bullets) {
    const l = Math.hypot(b.vx, b.vy), ux = b.vx / l, uy = b.vy / l;
    for (let i = 0; i < 4; i++) px(b.x - ux * i, b.y - uy * i, i < 3 ? C.white : C.grey);
  }
}

function drawPopups() {
  for (const q of popups) {
    if (q.t > 0.7 && Math.floor(q.t * 16) % 2) continue;
    const w = textW(q.str, q.size);
    const x = clamp(q.x, Math.ceil(w / 2) + 2, W - Math.ceil(w / 2) - 2);
    const y = Math.max(TOP + 2, q.y) - q.t * 14 - (q.t < 0.07 ? 3 : 0);
    if (q.big) stack(q.str, x, y, q.size, q.color, 3); else text(q.str, x, y, q.size, q.color);
  }
}

function drawHUD() {
  const y = 14;
  if (state !== 'title') text('+ ' + kills, 6, y, 10, C.red, 'left');
  const bstr = best + ' м', bw = textW(bstr, 10), total = 9 + bw, bx = Math.round(W / 2 - total / 2);
  ctx.drawImage(SPR.crown, bx, y - 5);
  text(bstr, bx + 9, y, 10, C.yellow, 'left');
  if (state === 'play' || state === 'pause') {
    ctx.drawImage(PAUSE_RING, W - 21, 3);
    ctx.fillStyle = C.white; ctx.fillRect(W - 15, 9, 1, 5); ctx.fillRect(W - 11, 9, 1, 5);
    if (oldBest > 0 && dist() > oldBest) {
      ctx.fillStyle = C.red; ctx.fillRect(W - 29, 22, 25, 10);
      ctx.fillRect(W - 30, 23, 1, 8); ctx.fillRect(W - 4, 23, 1, 8);
      text('NEW!', W - 16, 30, 10, C.white);
    }
  }
  if (state !== 'title') {
    const dd = state === 'play' || state === 'pause' ? Math.floor(dist()) : finalDist;
    text(dd + ' м', W / 2, 44, 20, C.white);
    if (state === 'play' && chain >= 2 && t - lastKillT < 1.4) text('x' + chain, W / 2, 56, 10, C.white);
  }
}

function frameBox(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(x + 1, y, w - 2, 1); ctx.fillRect(x + 1, y + h - 1, w - 2, 1);
  ctx.fillRect(x, y + 1, 1, h - 2); ctx.fillRect(x + w - 1, y + 1, 1, h - 2);
}

function drawOverlay() {
  if (state === 'title') {
    stack('НОЧНОЙ РЕЙС', W / 2, Math.round(H * 0.43), 20, C.white, 3);
    if (Math.floor(t * 1.6) % 2 === 0) text('жми, чтобы взлететь', W / 2, Math.round(H * 0.62), 10, C.white);
    text('в пике самолёт таранит врагов', W / 2, Math.round(H * 0.62) + 13, 10, C.grey);
  } else if (state === 'pause') {
    ctx.fillStyle = 'rgba(13,14,16,0.8)'; ctx.fillRect(0, 0, W, H);
    const cy = Math.round(H * 0.42);
    stack('пауза', W / 2, cy, 20, C.white, 2);
    text('жми, чтобы продолжить', W / 2, cy + 18, 10, C.grey);
    const bw = 76, bh = 16, bx = Math.round(W / 2 - bw / 2), by = cy + 32;
    frameBox(bx, by, bw, bh, C.white);
    text('звук: ' + (muted ? 'выкл' : 'вкл'), W / 2, by + 11, 10, C.white);
    soundBtn = { x: bx, y: by, w: bw, h: bh };
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(13,14,16,0.62)'; ctx.fillRect(0, 0, W, H);
    const cy = Math.round(H * 0.36);
    stack('СБИТ', W / 2, cy, 30, C.red, 3);
    text(finalDist + ' м', W / 2, cy + 30, 20, C.white);
    if (finalDist >= best && finalDist > oldBest && oldBest > 0) {
      if (Math.floor(t * 4) % 2 === 0) text('новый рекорд!', W / 2, cy + 46, 10, C.yellow);
    } else {
      const s = 'рекорд ' + best + ' м', w = textW(s, 10);
      const bx = Math.round(W / 2 - (w + 9) / 2);
      ctx.drawImage(SPR.crown, bx, cy + 41);
      text(s, bx + 9, cy + 46, 10, C.grey, 'left');
    }
    text('сбито врагов: ' + kills, W / 2, cy + 59, 10, C.grey);
    if (overT > 0.6) {
      const bw = 76, bh = 16, bx = Math.round(W / 2 - bw / 2), by = cy + 72;
      frameBox(bx, by, bw, bh, C.white);
      text('ещё раз', W / 2, by + 11, 10, C.white);
      retryBtn = { x: bx, y: by, w: bw, h: bh };
      const sy = by + 22;
      frameBox(bx, sy, bw, bh, pendingShare ? C.green : C.grey);
      text('поделиться', W / 2, sy + 11, 10, pendingShare ? C.green : C.grey);
      shareBtn = { x: bx, y: sy, w: bw, h: bh };
    }
    if (toast && t - toast.t < 2.2) text(toast.str, W / 2, cy + 128, 10, C.green);
  }
}

function render() {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const sw = W + 10;
  for (const s of stars) {
    const x = Math.floor((((s.x - camX * 0.03) % sw) + sw) % sw);
    px(x, s.y, s.tw && Math.sin(t * s.sp + s.ph) > 0.55 ? C.white : s.c);
  }
  ctx.drawImage(haloC, moonX - HALO_R, moonY - HALO_R);
  ctx.save();
  if (shake > 0.5 && !reduceMotion) ctx.translate(Math.round(rand(-shake, shake)), Math.round(rand(-shake, shake)));
  drawLayer(layers[0]);
  drawLayer(layers[1]);
  drawHints();
  drawTrail();
  drawEnemies();
  drawLayer(layers[2]);
  drawPlayer();
  for (const q of particles) px(q.x, q.y, q.c, q.sz);
  drawPopups();
  ctx.restore();
  drawHUD();
  drawOverlay();
}

// ---------- sizing ----------
function resize() {
  const cw = document.body.clientWidth, ch = document.body.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  const scale = Math.max(1, Math.round(ch * dpr / 400));
  H = Math.max(260, Math.floor(ch * dpr / scale));
  W = Math.max(150, Math.min(Math.floor(cw * dpr / scale), Math.floor(H * 0.8)));
  cv.width = W; cv.height = H;
  cv.style.width = (W * scale / dpr) + 'px';
  cv.style.height = (H * scale / dpr) + 'px';
  ctx.imageSmoothingEnabled = false;
  PX = Math.round(W * 0.27);
  buildBackdrop();
  if (state === 'play') { pause(); antennaFrom = Math.max(antennaFrom, camX + PX + 40); }
  if (player) player.y = clamp(player.y, TOP, H * 0.6);
  resetCity();
}

// ---------- input ----------
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
const inBox = (p, b) => b && p.x >= b.x - 4 && p.x <= b.x + b.w + 4 && p.y >= b.y - 4 && p.y <= b.y + b.h + 4;

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const p = toLogical(e);
  if (state === 'play' && Math.hypot(p.x - (W - 13), p.y - 11) < 15) { pause(); return; }
  if (state === 'pause') { if (inBox(p, soundBtn)) setMuted(!muted); else resume(); return; }
  if (state === 'dead') return;
  if (state === 'over') {
    if (overT < 0.6) return;
    if (inBox(p, shareBtn)) { pendingShare = true; return; }
    start();
  }
  else if (state === 'title') start();
  pointerHold = true;
  swipe = { y: e.clientY, t: performance.now() };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!swipe || state !== 'play') return;
  const now = performance.now(), dy = e.clientY - swipe.y;
  if (dy > 26 && now - swipe.t < 380) { dive(); swipe = { y: e.clientY, t: now }; }
  else if (now - swipe.t > 380 || dy < 0) swipe = { y: e.clientY, t: now };
});
const release = () => { pointerHold = false; swipe = null; pendingShare = false; };
cv.addEventListener('pointerup', e => {
  initAudio();
  if (pendingShare) {
    pendingShare = false;
    if (state === 'over' && inBox(toLogical(e), shareBtn)) shareResult();
  }
  release();
});
document.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

async function shareResult() {
  const url = location.href.split('#')[0];
  const msg = 'Я пролетел ' + finalDist + ' м в «Ночном рейсе». Сможешь дальше?';
  if (navigator.share) {
    try { await navigator.share({ title: 'Ночной рейс', text: msg, url }); return; }
    catch (err) { if (err && err.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(msg + ' ' + url); toast = { str: 'ссылка скопирована', t }; return; }
  catch (err) {}
  toast = { str: 'скопируй адрес страницы', t };
}
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());

const UP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
addEventListener('keydown', e => {
  const k = e.code;
  if (UP_KEYS.includes(k)) {
    e.preventDefault();
    if (e.repeat) return;
    initAudio();
    if (state === 'title' || (state === 'over' && overT > 0.6)) start();
    else if (state === 'pause') { resume(); return; }
    keyHold = true;
  } else if (k === 'ArrowDown' || k === 'KeyS') { e.preventDefault(); dive(); }
  else if (k === 'KeyP' || k === 'Escape') { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  else if (k === 'KeyM') { initAudio(); setMuted(!muted); }
});
addEventListener('keyup', e => { if (UP_KEYS.includes(e.code)) keyHold = false; });
addEventListener('blur', () => { keyHold = false; pointerHold = false; pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('resize', resize);

// ---------- boot ----------
resetRun();
resize();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) {
  Promise.race([
    Promise.all([document.fonts.load('10px "Tiny5"', 'A1'), document.fonts.load('10px "Tiny5"', 'Жж')]),
    new Promise(r => setTimeout(r, 2000))
  ]).then(() => tcache.clear());
}
})();
</script>
</body>
